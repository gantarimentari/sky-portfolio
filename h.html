<script type="module">
  import * as THREE from 'https://esm.sh/three@0.180.0';
  import gsap from 'https://esm.sh/gsap@3.14.2';
  import { ScrollTrigger } from 'https://esm.sh/gsap@3.14.2/ScrollTrigger';

  gsap.registerPlugin(ScrollTrigger);

  const canvas = document.querySelector('#scene');
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 0, 9);

  const ambient = new THREE.AmbientLight(0xffffff, 1.8);
  scene.add(ambient);

  const keyLight = new THREE.PointLight(0xc5ff62, 90);
  keyLight.position.set(4, 4, 5);
  scene.add(keyLight);

  const rimLight = new THREE.PointLight(0x8a7aff, 65);
  rimLight.position.set(-4, -2, 3);
  scene.add(rimLight);

  const group = new THREE.Group();
  scene.add(group);

  const geometry = new THREE.TorusKnotGeometry(1.65, 0.48, 240, 32, 2, 3);
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xc5ff62,
    metalness: 0.65,
    roughness: 0.19,
    clearcoat: 1,
    clearcoatRoughness: 0.1,
    flatShading: false
  });

  const sculpture = new THREE.Mesh(geometry, material);
  group.add(sculpture);
  group.position.set(2.2, 0, 0);

  const wire = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.7, 2),
    new THREE.MeshBasicMaterial({
      color: 0xffffff,
      wireframe: true,
      transparent: true,
      opacity: 0.055
    })
  );
  group.add(wire);

  const particlesGeometry = new THREE.BufferGeometry();
  const count = 350;
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 17;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 12;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  }

  particlesGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions, 3)
  );

  const particles = new THREE.Points(
    particlesGeometry,
    new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.018,
      transparent: true,
      opacity: 0.6
    })
  );
  scene.add(particles);

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reducedMotion) {
    const journey = gsap.timeline({
      scrollTrigger: {
        trigger: document.body,
        start: 'top top',
        end: 'bottom bottom',
        scrub: 1.6
      }
    });

    journey
      .to(group.rotation, { y: Math.PI * 1.4, x: 0.5, duration: 1 }, 0)
      .to(group.position, { x: -2.5, y: 0.4, z: -1.5, duration: 1 }, 0)
      .to(camera.position, { z: 5.8, duration: 1 }, 0)
      .to(group.rotation, { y: Math.PI * 3, z: 0.8, duration: 1 }, 1)
      .to(group.position, { x: 2.7, y: -0.4, z: -3, duration: 1 }, 1)
      .to(material.color, { r: 0.54, g: 0.48, b: 1, duration: 1 }, 1)
      .to(group.rotation, { y: Math.PI * 4.5, x: 1.5, duration: 1 }, 2)
      .to(group.position, { x: -2.5, y: 0.5, z: -2, duration: 1 }, 2)
      .to(group.scale, { x: 0.7, y: 0.7, z: 0.7, duration: 1 }, 2)
      .to(group.position, { x: 2.8, y: 0, z: -3, duration: 1 }, 3)
      .to(group.rotation, { y: Math.PI * 6, duration: 1 }, 3)
      .to(group.position, { x: 0, y: 0, z: -1, duration: 1 }, 4)
      .to(group.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 1 }, 4);

    gsap.utils.toArray('.reveal, .section-head, .project-copy, .experience-intro, .experience-item, .about h2, .contact h2').forEach(el => {
      gsap.from(el, {
        y: 70,
        opacity: 0,
        duration: 1,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: el,
          start: 'top 88%',
          once: true
        }
      });
    });

    gsap.utils.toArray('.project-visual').forEach(el => {
      gsap.from(el, {
        scale: 0.86,
        y: 100,
        opacity: 0,
        duration: 1.2,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: el,
          start: 'top 90%',
          once: true
        }
      });
    });
  }

  const mouse = { x: 0, y: 0 };
  window.addEventListener('pointermove', e => {
    mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (!reducedMotion) {
      sculpture.rotation.y += 0.002;
      wire.rotation.y -= 0.0006;
      group.rotation.x += (mouse.y * 0.12 - group.rotation.x * 0.001) * 0.002;
      particles.rotation.y = t * 0.003;
    }

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    ScrollTrigger.refresh();
  });
</script>
